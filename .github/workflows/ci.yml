name: CI

# The runnable app lives in arc-splitter/. The repo root still holds an
# older Next.js app that has no installable dependency set, so it is not
# built here.

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run pointless, so drop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc-splitter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 8 requires ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: npm
          cache-dependency-path: arc-splitter/package-lock.json

      # npm install, not npm ci. The lockfile gets regenerated by whoever
      # runs npm last, and on Windows npm prunes Linux-only optional deps
      # (@emnapi/core, @emnapi/runtime) that this Linux runner then needs.
      # npm ci treats that as a fatal mismatch; npm install resolves it.
      # Vercel installs the same way, so CI matches production.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # --if-present so this is a no-op until the test setup lands, rather
      # than a red X on every PR in the meantime.
      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build
